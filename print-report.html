
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Financial Report</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 30px;
    color: #222;
    background: #fff;
}

.header {
    text-align: center;
    margin-bottom: 20px;
}

#clubLogo {
    width: 80px;
    height: 80px;
    object-fit: contain;
    margin-bottom: 10px;
}

h1 {
    margin: 0;
    font-size: 42px;
}

.est {
    margin: 8px 0;
    color: #666;
    font-size: 15px;
}

h2 {
    margin: 10px 0;
    font-size: 28px;
}

hr {
    border: none;
    border-top: 2px solid #163266;
    margin: 20px 0;
}

.info {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.info p {
    margin: 6px 0;
    font-size: 18px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    border: 1px solid #000;
    padding: 12px;
    font-size: 18px;
    text-align: left;
}

th {
    background: #163266;
    color: #fff;
}

.balance {
    font-weight: bold;
    color: #16a34a;
}

.positive {
    color: #16a34a;
    font-weight: bold;
}

.negative {
    color: #dc2626;
    font-weight: bold;
}

.footer {
    margin-top: 70px;
    display: flex;
    justify-content: space-between;
}

.signature {
    width: 30%;
    text-align: center;
}

.line {
    border-top: 1px solid #000;
    margin-bottom: 8px;
}

.bottom {
    margin-top: 40px;
    text-align: center;
    font-size: 14px;
    color: #666;
}

@media print {

    body {
        margin: 15mm;
    }

}

</style>

</head>

<body>

<div class="header">

<!-- Replace with your logo path -->
<!-- <img src="images/logo.png" id="clubLogo"> -->

<h1>MURGABANI 1 TO 100 CLUB</h1>

<p class="est">Established : 2013</p>

<h2>Financial Statement Report</h2>

</div>

<hr>

<div class="info">

<p><b>Year :</b> <span id="printYear"></span></p>

<p><b>Puja :</b> <span id="printPuja"></span></p>

<p><b>Generated :</b> <span id="generatedDate"></span></p>

</div>

<table id="reportTable">

<tr>
    <th>Item</th>
    <th>Value</th>
</tr>

</table>

<div class="footer">

<div class="signature">

<div class="line"></div>

President

</div>

<div class="signature">

<div class="line"></div>

Treasurer

</div>

<div class="signature">

<div class="line"></div>

Secretary

</div>

</div>

<hr>

<div class="bottom">

MURGABANI 1 TO 100 CLUB

<br>

Generated by Club Management System

</div>

<script>

window.onload = () => {

    const report = JSON.parse(
        sessionStorage.getItem("clubReport")
    );

    if (!report) {

        alert("No report data found.");

        return;

    }

    document.getElementById("printYear").textContent =
        report.year ?? "";

    document.getElementById("printPuja").textContent =
        report.puja ?? "";

    document.getElementById("generatedDate").textContent =
        new Date().toLocaleString();

    const table = document.getElementById("reportTable");

    const rows = [

        ["Total Members", report.members],

        ["Village Collection", report.villageCollection],

        ["Members Collection", report.memberCollection],

        ["Road Collection", report.roadCollection],

        ["Total Collection", report.totalCollection],

        ["Total Expenses", report.totalExpense],

        ["Balance", report.balance]

    ];

    // Safely parse numeric or formatted currency values.
    const balanceText = String(report.balance ?? "0");

    const balanceValue =
        Number(balanceText.replace(/[^\d.-]/g, "")) || 0;

    // Create table rows safely without using innerHTML.
    rows.forEach(([label, value]) => {

        const tr = document.createElement("tr");

        const labelCell = document.createElement("td");

        const valueCell = document.createElement("td");

        if (label === "Balance") {

            const labelStrong = document.createElement("b");

            labelStrong.textContent = label;

            labelCell.appendChild(labelStrong);

            const valueStrong = document.createElement("b");

            valueStrong.textContent = String(value ?? "");

            valueCell.appendChild(valueStrong);

            valueCell.className =
                balanceValue >= 0 ? "positive" : "negative";

        } else {

            labelCell.textContent = String(label ?? "");

            valueCell.textContent = String(value ?? "");

        }

        tr.append(labelCell, valueCell);

        table.appendChild(tr);

    });

    /*
    Uncomment this after hosting on GitHub/Chrome.
    Acode localhost often blocks window.print().

    setTimeout(() => {
        window.focus();
        window.print();
    }, 800);
    */

};

</script>

</body>

</html>
